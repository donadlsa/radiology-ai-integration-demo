{% extends "base.html" %}

{% block title %}Troubleshooting Runbooks{% endblock %}

{% block page_title %}Troubleshooting Runbooks{% endblock %}

{% block content %}
<style>
    .runbook-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
    }

    .runbook-card {
        background: var(--bg-card, #1b2838);
        border: 1px solid var(--border, #2a3a4a);
        border-radius: 8px;
        padding: 18px 18px 14px 18px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        border-top: 4px solid var(--border, #2a3a4a);
    }

    .runbook-card:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--accent, #00d4aa);
        border-top-color: var(--accent, #00d4aa);
        transform: translateY(-2px);
    }

    .runbook-card.active {
        border-color: var(--accent, #00d4aa);
        border-top-color: var(--accent, #00d4aa);
        background: rgba(0, 212, 170, 0.06);
        box-shadow: 0 0 16px rgba(0, 212, 170, 0.15);
    }

    .runbook-card.severity-p1 { border-top-color: var(--status-red, #ff4757); }
    .runbook-card.severity-p2 { border-top-color: var(--status-yellow, #ffc107); }
    .runbook-card.severity-p3 { border-top-color: var(--accent, #00d4aa); }
    .runbook-card.active.severity-p1 { border-top-color: var(--status-red, #ff4757); }
    .runbook-card.active.severity-p2 { border-top-color: var(--status-yellow, #ffc107); }
    .runbook-card.active.severity-p3 { border-top-color: var(--accent, #00d4aa); }

    .runbook-card .card-title {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-primary, #e8edf3);
        margin-bottom: 6px;
        line-height: 1.3;
    }

    .runbook-card .card-desc {
        font-size: 0.78rem;
        color: var(--text-secondary, #8899aa);
        margin-bottom: 10px;
        line-height: 1.4;
    }

    .runbook-card .card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .severity-badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .severity-badge.severity-p1 { background: var(--status-red, #ff4757); color: #fff; }
    .severity-badge.severity-p2 { background: var(--status-yellow, #ffc107); color: #1a1a2e; }
    .severity-badge.severity-p3 { background: var(--accent, #00d4aa); color: #0d1b2a; }

    .time-badge {
        font-size: 0.7rem;
        color: var(--text-secondary, #8899aa);
    }

    /* Runbook workspace */
    #runbook-workspace {
        min-height: 200px;
    }

    .workspace-placeholder {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary, #8899aa);
        font-size: 1rem;
    }

    .workspace-placeholder .placeholder-icon {
        font-size: 3rem;
        margin-bottom: 12px;
        display: block;
        opacity: 0.4;
    }

    /* Title bar */
    .runbook-title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        background: var(--bg-card, #1b2838);
        border: 1px solid var(--border, #2a3a4a);
        border-radius: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .runbook-title-bar .title-info {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .runbook-title-bar h2 {
        margin: 0;
        font-size: 1.15rem;
        color: var(--text-primary, #e8edf3);
    }

    .runbook-title-bar .reset-btn {
        padding: 6px 16px;
        border: 1px solid var(--border, #2a3a4a);
        background: transparent;
        color: var(--text-secondary, #8899aa);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.82rem;
        transition: all 0.2s;
    }

    .runbook-title-bar .reset-btn:hover {
        border-color: var(--status-red, #ff4757);
        color: var(--status-red, #ff4757);
    }

    /* Progress bar */
    .progress-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.15);
        border-radius: 6px;
    }

    .progress-bar .progress-track {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        overflow: hidden;
    }

    .progress-bar .progress-fill {
        height: 100%;
        background: var(--accent, #00d4aa);
        border-radius: 3px;
        transition: width 0.4s ease;
        width: 0%;
    }

    .progress-bar .progress-text {
        font-size: 0.82rem;
        color: var(--text-secondary, #8899aa);
        white-space: nowrap;
    }

    /* Tree container */
    .tree-container {
        position: relative;
        padding: 0 0 40px 0;
    }

    /* Tree connector line */
    .tree-connector {
        width: 2px;
        height: 24px;
        background: var(--border, #2a3a4a);
        margin: 0 auto;
        transition: background 0.3s;
    }

    .tree-connector.active {
        background: var(--accent, #00d4aa);
    }

    /* Branch indicator */
    .tree-branch {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
    }

    .branch-label {
        font-size: 0.72rem;
        color: var(--accent, #00d4aa);
        background: rgba(0, 212, 170, 0.08);
        border: 1px solid rgba(0, 212, 170, 0.2);
        padding: 3px 10px;
        border-radius: 12px;
        text-align: center;
        max-width: 400px;
        margin: 4px auto;
    }

    /* Tree node */
    .tree-node {
        background: var(--bg-card, #1b2838);
        border: 1px solid var(--border, #2a3a4a);
        border-left: 4px solid var(--border, #2a3a4a);
        border-radius: 8px;
        padding: 20px;
        max-width: 700px;
        margin: 0 auto;
        transition: all 0.3s ease;
    }

    .tree-node.active {
        border-color: var(--accent, #00d4aa);
        border-left-color: var(--accent, #00d4aa);
        box-shadow: 0 0 20px rgba(0, 212, 170, 0.1);
    }

    .tree-node.completed {
        opacity: 0.6;
        border-left-color: var(--accent, #00d4aa);
    }

    .tree-node.completed .node-title::after {
        content: " \2713";
        color: var(--accent, #00d4aa);
        font-weight: 700;
    }

    .tree-node.resolution {
        border-left-color: #2ecc71;
        background: rgba(46, 204, 113, 0.04);
    }

    .tree-node.resolution.active {
        border-color: #2ecc71;
        border-left-color: #2ecc71;
        box-shadow: 0 0 20px rgba(46, 204, 113, 0.1);
    }

    .tree-node.escalation {
        border-left-color: var(--status-red, #ff4757);
        background: rgba(255, 71, 87, 0.04);
    }

    .tree-node.escalation.active {
        border-color: var(--status-red, #ff4757);
        border-left-color: var(--status-red, #ff4757);
        box-shadow: 0 0 20px rgba(255, 71, 87, 0.1);
    }

    .tree-node.hidden {
        display: none;
    }

    /* Node internals */
    .node-title {
        font-weight: 600;
        font-size: 1rem;
        color: var(--text-primary, #e8edf3);
        margin-bottom: 8px;
    }

    .node-instruction {
        color: var(--text-secondary, #8899aa);
        font-size: 0.88rem;
        line-height: 1.6;
        margin-bottom: 14px;
    }

    .node-api-result {
        margin: 12px 0;
        padding: 12px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        font-family: monospace;
        font-size: 0.8rem;
        color: var(--text-secondary, #8899aa);
        overflow-x: auto;
        max-height: 300px;
        overflow-y: auto;
        display: none;
    }

    .node-api-result.visible {
        display: block;
    }

    .node-api-result pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .run-check-btn {
        padding: 8px 18px;
        border: 1px solid var(--accent, #00d4aa);
        background: rgba(0, 212, 170, 0.1);
        color: var(--accent, #00d4aa);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.84rem;
        font-weight: 600;
        transition: background 0.2s;
        margin-bottom: 12px;
    }

    .run-check-btn:hover {
        background: rgba(0, 212, 170, 0.22);
    }

    .run-check-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Outcome buttons */
    .outcome-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 4px;
    }

    .outcome-btn {
        padding: 8px 16px;
        border: 1px solid var(--border, #2a3a4a);
        background: transparent;
        color: var(--text-secondary, #8899aa);
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.82rem;
        transition: all 0.2s;
        text-align: left;
        line-height: 1.35;
    }

    .outcome-btn:hover {
        border-color: var(--accent, #00d4aa);
        color: var(--text-primary, #e8edf3);
        background: rgba(0, 212, 170, 0.06);
    }

    .outcome-btn.style-danger { border-color: rgba(255, 71, 87, 0.4); }
    .outcome-btn.style-danger:hover { border-color: var(--status-red, #ff4757); background: rgba(255, 71, 87, 0.08); }
    .outcome-btn.style-warning { border-color: rgba(255, 193, 7, 0.4); }
    .outcome-btn.style-warning:hover { border-color: var(--status-yellow, #ffc107); background: rgba(255, 193, 7, 0.08); }
    .outcome-btn.style-success { border-color: rgba(46, 204, 113, 0.4); }
    .outcome-btn.style-success:hover { border-color: #2ecc71; background: rgba(46, 204, 113, 0.08); }

    .outcome-btn.selected {
        background: rgba(0, 212, 170, 0.15);
        border-color: var(--accent, #00d4aa);
        color: var(--accent, #00d4aa);
        font-weight: 600;
    }

    .outcome-btn.dimmed {
        opacity: 0.3;
        pointer-events: none;
    }

    /* Resolution / Escalation boxes inside nodes */
    .resolution-box {
        padding: 14px 18px;
        background: rgba(46, 204, 113, 0.08);
        border: 1px solid rgba(46, 204, 113, 0.25);
        border-radius: 6px;
        margin-top: 8px;
    }

    .resolution-box h4 {
        margin: 0 0 6px 0;
        color: #2ecc71;
        font-size: 0.9rem;
    }

    .resolution-box p {
        margin: 0;
        color: var(--text-secondary, #8899aa);
        font-size: 0.85rem;
        line-height: 1.5;
    }

    .resolution-box .mark-resolved-btn {
        margin-top: 10px;
        padding: 6px 18px;
        border: 1px solid #2ecc71;
        background: rgba(46, 204, 113, 0.15);
        color: #2ecc71;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 600;
        transition: background 0.2s;
    }

    .resolution-box .mark-resolved-btn:hover {
        background: rgba(46, 204, 113, 0.3);
    }

    .escalation-box {
        padding: 14px 18px;
        background: rgba(255, 71, 87, 0.08);
        border: 1px solid rgba(255, 71, 87, 0.25);
        border-radius: 6px;
        margin-top: 8px;
    }

    .escalation-box h4 {
        margin: 0 0 6px 0;
        color: var(--status-red, #ff4757);
        font-size: 0.9rem;
    }

    .escalation-box p {
        margin: 0;
        color: var(--text-secondary, #8899aa);
        font-size: 0.85rem;
        line-height: 1.5;
    }

    /* Tree path highlight */
    .tree-path .tree-connector {
        background: var(--accent, #00d4aa);
    }

    /* Responsive tweaks */
    @media (max-width: 900px) {
        .runbook-cards {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }
        .tree-node {
            max-width: 100%;
        }
    }
</style>

<div class="runbook-selector">
    <div class="runbook-cards" id="runbook-cards">
        <!-- Cards rendered by JS -->
    </div>
</div>

<div id="runbook-workspace">
    <div class="workspace-placeholder">
        <span class="placeholder-icon">&#128269;</span>
        Select a scenario above to begin troubleshooting
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/runbooks.js"></script>
{% endblock %}
