{% extends "base.html" %}

{% block title %}Diagnostic Tools{% endblock %}

{% block content %}
<div class="tool-grid">

  <!-- Panel 1: HL7 Message Parser -->
  <div class="tool-panel">
    <h3>HL7 Message Parser</h3>
    <label for="hl7-sample-select">Sample Message:</label>
    <select id="hl7-sample-select"></select>
    <textarea id="hl7-input" rows="10" style="font-family:monospace;width:100%;" placeholder="Paste HL7 message here..."></textarea>
    <button id="hl7-parse-btn">Parse Message</button>
    <div id="hl7-results" class="results-area"></div>
  </div>

  <!-- Panel 2: DICOM Tag Inspector -->
  <div class="tool-panel">
    <h3>DICOM Tag Inspector</h3>
    <label for="dicom-file-select">Sample DICOM File:</label>
    <select id="dicom-file-select"></select>
    <label for="dicom-group-select">Tag Group:</label>
    <select id="dicom-group-select">
      <option value="all">All</option>
      <option value="patient">Patient</option>
      <option value="study">Study</option>
      <option value="series">Series</option>
      <option value="equipment">Equipment</option>
      <option value="routing">Routing</option>
      <option value="image">Image</option>
    </select>
    <button id="dicom-inspect-btn">Inspect Tags</button>
    <div id="dicom-results" class="results-area"></div>
  </div>

  <!-- Panel 3: FHIR Resource Validator -->
  <div class="tool-panel">
    <h3>FHIR Resource Validator</h3>
    <label for="fhir-sample-select">Sample FHIR Resource:</label>
    <select id="fhir-sample-select"></select>
    <textarea id="fhir-input" rows="10" style="font-family:monospace;width:100%;" placeholder="Paste FHIR JSON here..."></textarea>
    <button id="fhir-validate-btn">Validate Resource</button>
    <div id="fhir-results" class="results-area"></div>
  </div>

  <!-- Panel 4: Demographics Comparator -->
  <div class="tool-panel">
    <h3>Demographics Comparator</h3>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;">
        <label for="demo-hl7">HL7 Demographics</label>
        <textarea id="demo-hl7" rows="6" style="font-family:monospace;width:100%;"></textarea>
      </div>
      <div style="flex:1;">
        <label for="demo-dicom">DICOM Demographics</label>
        <textarea id="demo-dicom" rows="6" style="font-family:monospace;width:100%;"></textarea>
      </div>
    </div>
    <button id="demo-compare-btn">Compare</button>
    <div id="demo-results" class="results-area"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/diagnostics.js"></script>
{% endblock %}
